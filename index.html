<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Weather App</h1>
        
        <form id="weather-form">
            <input type="text" id="location-input" placeholder="Enter city name..." required>
            <button type="submit">Search</button>
        </form>

        <div id="loading" class="hidden">Fetching weather data...</div>

        <div id="weather-display" class="hidden">
            <h2 id="city-name"></h2>
            <p id="weather-condition"></p>
            <div class="temp-wrapper">
                <span id="temperature"></span>
                <button id="toggle-temp">Toggle °C / °F</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
